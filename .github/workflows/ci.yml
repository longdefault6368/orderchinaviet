name: CI
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend install and generate
        working-directory: backend
        run: npm ci && npm run prisma:generate
      - name: Backend build and tests
        working-directory: backend
        env:
          DATABASE_URL: file:./ci.db
          JWT_SECRET: ci-test-secret-at-least-32-characters
          JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
          CORS_ORIGIN: http://localhost:3000
          SEED_PASSWORD: password123
        run: npm run prisma:push && npm run prisma:seed && npm run build && npm test
      - name: Frontend install and build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
        run: npm ci && npm run build
