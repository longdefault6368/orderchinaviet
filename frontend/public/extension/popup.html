<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrderChinaViet — Mua Hộ</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      width: 380px;
      min-height: 200px;
      font-family: Arial, Tahoma, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      overflow-x: hidden;
    }

    /* ─── Header ─── */
    .header {
      background: linear-gradient(135deg, #fa3131 0%, #0c3ed0 100%);
      padding: 12px 14px 10px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand img {
      width: 110px !important;
      height: 24px !important;
      max-width: 110px !important;
      max-height: 24px !important;
      object-fit: contain !important;
      filter: brightness(0) invert(1);
    }

    .brand-text { display: flex; flex-direction: column; }
    .brand-text strong { color: #fff; font-size: 12px; font-weight: 800; letter-spacing: 0.01em; }
    .brand-text span { color: rgba(255,255,255,0.7); font-size: 9px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }

    .header-actions { display: flex; gap: 4px; }

    .btn-icon-header {
      width: 26px; height: 26px;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 7px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: white;
      font-size: 11px;
      font-weight: 800;
      transition: background 0.15s;
      text-decoration: none;
    }
    .btn-icon-header:hover { background: rgba(255,255,255,0.3); }

    .platform-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 5px 10px;
    }

    .platform-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 0 2px rgba(74,222,128,0.35);
      flex-shrink: 0;
    }

    .platform-dot.inactive { background: #94a3b8; box-shadow: none; }

    .platform-text { color: rgba(255,255,255,0.9); font-size: 10px; font-weight: 700; }
    .exrate-text { margin-left: auto; color: rgba(255,255,255,0.7); font-size: 10px; font-family: Arial, Tahoma, sans-serif; font-weight: 700; }

    /* ─── Tabs ─── */
    .tabs {
      display: flex;
      background: white;
      border-bottom: 1px solid #e2e8f0;
      padding: 0 2px;
    }

    .tab {
      flex: 1;
      padding: 10px 6px;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .tab:hover { color: #475569; }
    .tab.active { color: #fa3131; border-bottom-color: #fa3131; }
    .tab.active svg { color: #fa3131; }

    .tab-badge {
      background: #fa3131;
      color: white;
      font-size: 8px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 8px;
      line-height: 14px;
    }

    /* ─── Tab Panels ─── */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ─── Product Section ─── */
    .product-section {
      padding: 12px 12px 6px;
    }

    .section-label {
      font-size: 9px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .product-card {
      background: linear-gradient(135deg, #fff7f7 0%, #eff6ff 100%);
      border: 1px solid #e0e7ff;
      border-radius: 12px;
      padding: 12px;
    }

    .product-name {
      font-size: 12px;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.45;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-name.empty {
      color: #94a3b8;
      font-weight: 600;
      font-style: italic;
    }

    .price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .price-cny {
      font-size: 20px;
      font-weight: 800;
      color: #fa3131;
      font-family: Arial, Tahoma, sans-serif;
      line-height: 1;
    }

    .price-vnd {
      font-size: 10px;
      font-weight: 700;
      color: #0c3ed0;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 4px 10px;
      border-radius: 7px;
      font-family: Arial, Tahoma, sans-serif;
    }

    /* ─── Add Controls ─── */
    .add-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
    }

    .qty-box {
      display: flex;
      align-items: center;
      border: 1.5px solid #e2e8f0;
      border-radius: 9px;
      overflow: hidden;
      background: white;
    }

    .qty-btn {
      width: 30px; height: 32px;
      background: #f8fafc;
      border: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: 800;
      color: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .qty-btn:hover { background: #f1f5f9; }

    .qty-input {
      width: 40px; height: 32px;
      border: none;
      border-left: 1px solid #e2e8f0;
      border-right: 1px solid #e2e8f0;
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      color: #1e293b;
      outline: none;
      background: white;
      font-family: Arial, Tahoma, sans-serif;
    }

    .btn-add {
      flex: 1;
      height: 32px;
      background: linear-gradient(135deg, #fa3131 0%, #d62828 100%);
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(250,49,49,0.3);
      letter-spacing: 0.02em;
    }
    .btn-add:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(250,49,49,0.4); }
    .btn-add:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .note-row { padding: 0 12px 8px; }

    .note-input {
      width: 100%;
      padding: 8px 10px;
      border: 1.5px solid #e2e8f0;
      border-radius: 9px;
      font-size: 11px;
      color: #475569;
      outline: none;
      resize: none;
      background: #f8fafc;
      font-family: Arial, Tahoma, sans-serif;
      transition: border-color 0.2s;
      line-height: 1.5;
    }
    .note-input:focus { border-color: #0c3ed0; background: white; }
    .note-input::placeholder { color: #94a3b8; }

    /* ─── Cart Tab ─── */
    .cart-section { padding: 8px 0 0; }

    .cart-list { max-height: 260px; overflow-y: auto; padding: 0 12px; }

    .cart-list::-webkit-scrollbar { width: 4px; }
    .cart-list::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 4px; }

    .cart-item {
      background: white;
      border: 1px solid #f1f5f9;
      border-radius: 10px;
      padding: 9px 10px;
      margin-bottom: 6px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .cart-item:hover { border-color: #e0e7ff; }

    .cart-item-info { flex: 1; min-width: 0; }

    .cart-item-name {
      font-size: 11px;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.35;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .cart-item-meta {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .tag-price { font-size: 11px; font-weight: 800; color: #fa3131; font-family: Arial, Tahoma, sans-serif; }
    .tag-qty { font-size: 10px; color: #64748b; background: #f1f5f9; padding: 1px 6px; border-radius: 5px; font-weight: 700; font-family: Arial, Tahoma, sans-serif; }
    .tag-platform { font-size: 9px; font-weight: 700; color: #0c3ed0; background: #eff6ff; border: 1px solid #bfdbfe; padding: 1px 5px; border-radius: 5px; text-transform: uppercase; }
    .tag-vnd { font-size: 10px; color: #059669; font-weight: 700; font-family: Arial, Tahoma, sans-serif; }

    .cart-item-note { font-size: 10px; color: #94a3b8; font-style: italic; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .btn-remove {
      background: none; border: none; cursor: pointer;
      color: #cbd5e1; font-size: 16px; line-height: 1;
      border-radius: 5px; padding: 0 2px;
      transition: color 0.15s;
      flex-shrink: 0;
    }
    .btn-remove:hover { color: #fa3131; }

    .cart-empty {
      text-align: center;
      padding: 28px 12px;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
    }
    .cart-empty-icon { font-size: 30px; display: block; margin-bottom: 7px; opacity: 0.5; }

    /* ─── Cart Footer ─── */
    .cart-footer {
      padding: 10px 12px;
      border-top: 1px solid #f1f5f9;
      background: #fafafa;
    }

    .total-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .total-label { font-size: 11px; font-weight: 700; color: #475569; }

    .total-amounts { text-align: right; }
    .total-cny { font-size: 14px; font-weight: 800; color: #fa3131; font-family: Arial, Tahoma, sans-serif; }
    .total-vnd { font-size: 10px; font-weight: 700; color: #0c3ed0; font-family: Arial, Tahoma, sans-serif; }

    .btn-submit {
      width: 100%;
      padding: 9px;
      background: linear-gradient(135deg, #0c3ed0 0%, #1e40af 100%);
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      letter-spacing: 0.02em;
      transition: all 0.2s;
      box-shadow: 0 2px 10px rgba(12,62,208,0.3);
    }
    .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(12,62,208,0.4); }
    .btn-submit:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    /* ─── Toast ─── */
    .toast {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      z-index: 9999;
      display: none;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      animation: toastIn 0.25s ease;
      font-family: Arial, Tahoma, sans-serif;
    }
    .toast.show { display: flex; }
    .toast.success { background: linear-gradient(135deg, #059669, #047857); }
    .toast.error { background: linear-gradient(135deg, #fa3131, #d62828); }

    @keyframes toastIn {
      from { transform: translateX(-50%) translateY(10px); opacity: 0; }
      to   { transform: translateX(-50%) translateY(0);    opacity: 1; }
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 8px;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
    }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid #e2e8f0;
      border-top-color: #0c3ed0;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .supported-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 12px;
      background: #fff;
      border-top: 1px solid #f1f5f9;
      flex-wrap: wrap;
    }

    .supported-label { font-size: 9px; color: #94a3b8; font-weight: 700; }
    .supported-chip {
      font-size: 9px;
      font-weight: 700;
      color: #475569;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      padding: 2px 7px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <div class="brand">
        <img src="logo.png" alt="OrderChinaViet" id="logo" width="110" height="24" style="width:110px;height:24px;object-fit:contain" />
        <div class="brand-text">
          <strong>OrderChinaViet</strong>
          <span>Mua Hộ Platform</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-open-orders" class="btn-icon-header" title="Mở trang Đặt Hàng" style="background:none;border:none;cursor:pointer;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </button>
        <button id="btn-open-dash" class="btn-icon-header" title="Mở Dashboard" style="background:none;border:none;cursor:pointer;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        </button>
      </div>
    </div>
    <div class="platform-indicator">
      <div class="platform-dot" id="platform-dot"></div>
      <div class="platform-text" id="platform-text">Đang kiểm tra trang...</div>
      <div class="exrate-text">1 ¥ = 3.650 ₫</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="add">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Thêm Sản Phẩm
    </button>
    <button class="tab" data-tab="cart">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 001.99 1.61h9.72a2 2 0 001.99-1.61L23 6H6"/></svg>
      Giỏ Hàng Mua Hộ
      <span class="tab-badge" id="tab-cart-badge">0</span>
    </button>
  </div>

  <!-- Tab: Thêm Sản Phẩm -->
  <div class="tab-panel active" id="panel-add">
    <div id="add-loading" class="loading">
      <div class="spinner"></div>
      Đang đọc thông tin sản phẩm...
    </div>

    <div id="add-content" style="display:none">
      <div class="product-section">
        <div class="section-label">Sản Phẩm Đang Xem</div>
        <div class="product-card">
          <div class="product-name" id="product-name">Chưa phát hiện sản phẩm</div>
          <div class="price-row">
            <div class="price-cny" id="price-cny">—</div>
            <div class="price-vnd" id="price-vnd" style="display:none"></div>
          </div>
        </div>
      </div>

      <div class="add-controls">
        <div class="qty-box">
          <button class="qty-btn" id="qty-dec">−</button>
          <input class="qty-input" type="number" id="qty" value="1" min="1" max="9999" />
          <button class="qty-btn" id="qty-inc">+</button>
        </div>
        <button class="btn-add" id="btn-add" disabled>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Thêm Vào Giỏ
        </button>
      </div>

      <div class="note-row">
        <textarea class="note-input" id="note" rows="2" placeholder="Ghi chú: màu, size, yêu cầu đặc biệt..."></textarea>
      </div>
    </div>

    <div class="supported-bar">
      <span class="supported-label">Hỗ trợ:</span>
      <span class="supported-chip">1688</span>
      <span class="supported-chip">Taobao</span>
      <span class="supported-chip">Tmall</span>
      <span class="supported-chip">Pinduoduo</span>
      <span class="supported-chip">Alibaba</span>
      <span class="supported-chip">AliExpress</span>
    </div>
  </div>

  <!-- Tab: Giỏ Hàng -->
  <div class="tab-panel" id="panel-cart">
    <div class="cart-section">
      <div class="cart-list" id="cart-list">
        <!-- Populated by JS -->
      </div>
    </div>
    <div class="cart-footer" id="cart-footer">
      <!-- Populated by JS -->
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
